name: Deploy to apex1-consol.github.io

on:
  push:
    branches: [main]
    paths:
      - 'index.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ApexOne
        uses: actions/checkout@v4

      - name: Checkout live site repo
        uses: actions/checkout@v4
        with:
          repository: Apex1-Consol/apex1-consol.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: live-site

      - name: Sync index.html
        run: |
          cp index.html live-site/index.html
          cd live-site
          if git diff --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-deploy: sync index.html from ApexOne"
          git push
