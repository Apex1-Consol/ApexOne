name: Deploy to apex1-consol.github.io

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'programme-initiation.html'
      - 'report-generator.html'
      - 'qcto-seta-links.html'
      - 'supabase/functions/**'

jobs:
  deploy-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ApexOne
        uses: actions/checkout@v4

      - name: Checkout live site repo
        uses: actions/checkout@v4
        with:
          repository: Apex1-Consol/apex1-consol.github.io
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: live-site

      - name: Sync HTML files
        run: |
          cp index.html live-site/index.html
          cp programme-initiation.html live-site/programme-initiation.html
          cp report-generator.html live-site/report-generator.html
          cp qcto-seta-links.html live-site/qcto-seta-links.html
          cd live-site
          if git diff --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html programme-initiation.html report-generator.html qcto-seta-links.html
          git commit -m "Auto-deploy: sync files from ApexOne"
          git push

  deploy-edge-functions:
    runs-on: ubuntu-latest
    # Only run when Edge Function files actually changed
    if: |
      contains(join(github.event.commits.*.modified, ' '), 'supabase/functions') ||
      contains(join(github.event.commits.*.added, ' '), 'supabase/functions')
    steps:
      - name: Checkout ApexOne
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy clickup-sync Edge Function
        run: |
          supabase functions deploy clickup-sync \
            --project-ref nducwhlmudksgxggjrbo \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
