<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAM Registry — ApexOne</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<style>
  body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#0C2F52;color:#F7F4EC;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;}
  .card{text-align:center;max-width:360px;padding:28px;}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid rgba(212,165,55,0.25);border-top-color:#D4A537;margin:0 auto 16px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  p{font-size:13px;color:#B7C7DA;line-height:1.5;}
  a{color:#378ADD;}
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <p>FAM Registry has moved into the main ApexOne app.<br>Redirecting&hellip;</p>
  <p><a id="manual-link" href="index.html#view=fam">Click here if you are not redirected automatically</a></p>
</div>
<script>
  // fam-registry.html now redirects into index.html's native FAM tab (see the
  // fam-registry/native-tab-foldin fold-in, verified live before this stub was
  // put in place). This page intentionally has no app logic of its own any
  // more -- it only preserves the ?assessor=<id> deep-link convention that
  // existing links and bookmarks may still use, translating it to the new
  // #view=fam&assessor=<id> hash convention index.html expects.
  var assessorId = new URLSearchParams(location.search).get('assessor');
  var target = assessorId
    ? 'index.html#view=fam&assessor=' + encodeURIComponent(assessorId)
    : 'index.html#view=fam';
  document.getElementById('manual-link').href = target;
  location.replace(target);
</script>
</body>
</html>
